<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T-rex flower bouquet</title>
<style>
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#FBF7F0;
    font-family:sans-serif;
  }
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
  .sparkle{animation:twinkle 2.2s ease-in-out infinite;}
  @keyframes twinkle{0%,100%{opacity:.12;}50%{opacity:1;}}
</style>
</head>
<body>
<h2 class="sr-only">A T-rex silhouette made of flowers, wrapped as a bouquet, surrounded by small cartoon dinosaur stickers. Tapping any dinosaur shuffles the flower colors.</h2>
<div style="max-width:380px;width:100%;margin:0 auto;padding:24px;">
<svg id="dinoSvg" width="100%" viewBox="0 0 380 500" role="img">
<title>Flower T-rex bouquet with tappable dinosaur stickers</title>
<desc>A T-rex shaped from many small flowers, wrapped like a bouquet, with small dinosaur stickers around it. Tapping any dinosaur changes the flower colors.</desc>
<defs><clipPath id="dinoClip"></clipPath></defs>
<g id="stems"></g>
<g id="bouquet">
<g id="flowerField" clip-path="url(#dinoClip)"></g>
</g>
<g id="wrap"></g>
<g id="sparkles"></g>
<g id="stickers"></g>
</svg>
</div>
<script>
(function(){
var ns="http://www.w3.org/2000/svg";
function el(tag,attrs){var e=document.createElementNS(ns,tag);for(var k in attrs){e.setAttribute(k,attrs[k]);}return e;}

var clip=document.getElementById('dinoClip');
clip.appendChild(el('ellipse',{cx:175,cy:225,rx:85,ry:68}));
clip.appendChild(el('ellipse',{cx:170,cy:275,rx:55,ry:38}));
var spine=[[275,138,38],[312,160,18],[300,180,12],[240,168,28],[202,168,36],[115,170,38],[80,190,30],[52,203,22],[27,211,15],[10,213,8],[262,232,12]];
spine.forEach(function(p){clip.appendChild(el('circle',{cx:p[0],cy:p[1],r:p[2]}));});

var petalPalette=['#ED93B1','#F0997B','#AFA9EC','#F4C0D1','#7F77DD','#D85A30'];
var centerPalette=['#FAC775','#EF9F27','#3C3489'];

function flower(cx,cy,size,pc,cc,rot,petals){
  var g=el('g',{transform:'translate('+cx+','+cy+') rotate('+rot+')'});
  var n=petals||6;
  var petalEls=[];
  for(var i=0;i<n;i++){
    var a=i*(360/n);
    var pg=el('g',{transform:'rotate('+a+')'});
    var pe=el('ellipse',{cx:0,cy:-size*0.55,rx:size*0.3,ry:size*0.55,fill:pc});
    pg.appendChild(pe);
    g.appendChild(pg);
    petalEls.push(pe);
  }
  var ce=el('circle',{r:size*0.26,fill:cc});
  g.appendChild(ce);
  g._petals=petalEls;
  g._center=ce;
  return g;
}
function rnd(a,b){return a+Math.random()*(b-a);}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}

var field=document.getElementById('flowerField');
var colorFlowers=[];
for(var y=60;y<322;y+=36){
  for(var x=10;x<336;x+=36){
    var jx=x+rnd(-8,8), jy=y+rnd(-8,8);
    if(Math.random()<0.22){
      field.appendChild(flower(jx,jy,rnd(9,13),'#FFFFFF','#D3D1C7',rnd(0,60),5));
    } else {
      var fg=flower(jx,jy,rnd(15,24),pick(petalPalette),pick(centerPalette),rnd(0,60),6);
      field.appendChild(fg);
      colorFlowers.push(fg);
    }
  }
}
spine.forEach(function(p){
  var fg=flower(p[0],p[1],p[2]*0.85,pick(petalPalette),pick(centerPalette),rnd(0,60),6);
  field.appendChild(fg);
  colorFlowers.push(fg);
});
var fA=flower(175,225,50,pick(petalPalette),pick(centerPalette),10,6);
field.appendChild(fA); colorFlowers.push(fA);
var fB=flower(170,275,40,pick(petalPalette),pick(centerPalette),25,6);
field.appendChild(fB); colorFlowers.push(fB);

function recolorBouquet(){
  colorFlowers.forEach(function(f){
    var pc=pick(petalPalette), cc=pick(centerPalette);
    f._petals.forEach(function(p){p.setAttribute('fill',pc);});
    f._center.setAttribute('fill',cc);
  });
}

var stems=document.getElementById('stems');
[["M150,310 Q140,380 178,445"],["M188,312 Q188,385 188,450"],["M228,310 Q245,380 200,445"]].forEach(function(d){
  stems.appendChild(el('path',{d:d[0],stroke:'#3B6D11','stroke-width':5,fill:'none','stroke-linecap':'round'}));
});
var leaf1=el('ellipse',{cx:148,cy:355,rx:16,ry:7,fill:'#639922',transform:'rotate(-35 148 355)'});
var leaf2=el('ellipse',{cx:232,cy:361,rx:16,ry:7,fill:'#639922',transform:'rotate(35 232 361)'});
stems.appendChild(leaf1); stems.appendChild(leaf2);

var wrap=document.getElementById('wrap');
wrap.appendChild(el('path',{d:'M135,400 L245,400 L207,483 L173,483 Z',fill:'#E8D9C0',stroke:'#C9B08A','stroke-width':1}));
wrap.appendChild(el('path',{d:'M190,400 C160,379 138,391 150,412 C160,427 180,416 190,400 Z',fill:'#D4537E'}));
wrap.appendChild(el('path',{d:'M190,400 C220,379 242,391 230,412 C220,427 200,416 190,400 Z',fill:'#D4537E'}));
wrap.appendChild(el('circle',{cx:190,cy:402,r:8,fill:'#993556'}));

var sparkPos=[[65,105],[318,140],[55,260],[300,225],[195,55],[85,250]];
var sparkles=document.getElementById('sparkles');
function star(cx,cy,s){
  var d='M'+cx+','+(cy-s)+' L'+(cx+s*0.25)+','+(cy-s*0.25)+' L'+(cx+s)+','+cy+' L'+(cx+s*0.25)+','+(cy+s*0.25)+' L'+cx+','+(cy+s)+' L'+(cx-s*0.25)+','+(cy+s*0.25)+' L'+(cx-s)+','+cy+' L'+(cx-s*0.25)+','+(cy-s*0.25)+' Z';
  return el('path',{d:d,fill:'#FAC775',class:'sparkle',style:'animation-delay:'+rnd(0,2).toFixed(2)+'s'});
}
sparkPos.forEach(function(p){sparkles.appendChild(star(p[0],p[1],6));});

function stickerDino(cx,cy,scale,rot,color){
  var g=el('g',{transform:'translate('+cx+','+cy+') rotate('+rot+') scale('+scale+')'});
  g.appendChild(el('circle',{cx:0,cy:0,r:30,fill:'#FFFFFF',stroke:'#DCD3C2','stroke-width':1.5}));
  g.appendChild(el('ellipse',{cx:-10,cy:-12,rx:9,ry:6,fill:'#FFFFFF',opacity:0.5,transform:'rotate(-20 -10 -12)'}));
  var body=el('g',{fill:color});
  body.appendChild(el('ellipse',{cx:-3,cy:3,rx:13,ry:8}));
  body.appendChild(el('circle',{cx:15,cy:-7,r:7}));
  body.appendChild(el('circle',{cx:23,cy:-3,r:4}));
  body.appendChild(el('path',{d:'M5,-2 Q10,-8 15,-7',stroke:color,'stroke-width':7,fill:'none','stroke-linecap':'round'}));
  body.appendChild(el('path',{d:'M-14,3 Q-21,1 -25,4',stroke:color,'stroke-width':6,fill:'none','stroke-linecap':'round'}));
  body.appendChild(el('path',{d:'M-23,3 Q-26,2 -27,4',stroke:color,'stroke-width':3,fill:'none','stroke-linecap':'round'}));
  body.appendChild(el('path',{d:'M7,4 L11,7',stroke:color,'stroke-width':3,fill:'none','stroke-linecap':'round'}));
  body.appendChild(el('rect',{x:-7,y:7,width:4,height:6,rx:2}));
  body.appendChild(el('rect',{x:2,y:8,width:4,height:6,rx:2}));
  body.appendChild(el('circle',{cx:17,cy:-8,r:1.3,fill:'#FFFFFF'}));
  g.appendChild(body);
  return g;
}
var stickers=document.getElementById('stickers');
var stickerList=[
  [55,55,1.0,-12,'#1D9E75'],
  [328,70,0.95,15,'#D85A30'],
  [45,290,1.05,-18,'#7F77DD'],
  [345,300,0.9,10,'#D4537E'],
  [55,440,1.0,8,'#639922'],
  [335,440,1.05,-10,'#EF9F27']
];
stickerList.forEach(function(s){
  var sEl=stickerDino(s[0],s[1],s[2],s[3],s[4]);
  stickers.appendChild(sEl);
  sEl.style.cursor='pointer';
  sEl.addEventListener('click',recolorBouquet);
});

var bouquet=document.getElementById('bouquet');
bouquet.style.cursor='pointer';
bouquet.addEventListener('click',recolorBouquet);

var start=Date.now();
function tick(){
  var t=(Date.now()-start)/1000;
  var angle=Math.sin(t*1.1)*2.2;
  bouquet.setAttribute('transform','rotate('+angle.toFixed(2)+' 188 450)');
  requestAnimationFrame(tick);
}
tick();
})();
</script>
</body>
</html>
